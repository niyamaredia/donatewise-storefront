<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonateWise Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <h1 class="logo">DonateWise</h1>
  <div class="nav-actions">
    <button class="btn-secondary">Log Out</button>
    <a href="dashboard.html" class="btn-primary">Dashboard</a>
  </div>
</header>

<section class="hero fade-in">
  <h2>Live Inventory System</h2>
  <p>Real-time visibility of available donated items</p>
</section>

<section class="controls">
  <input id="searchInput" type="text" placeholder="Search items...">

  <div class="filters">
    <button class="filter-btn active" data-category="all">All</button>
    <button class="filter-btn" data-category="electronics">Electronics</button>
    <button class="filter-btn" data-category="furniture">Furniture</button>
    <button class="filter-btn" data-category="clothing">Clothing</button>
    <button class="filter-btn" data-category="household">Household</button>
  </div>
</section>

<section id="itemsContainer" class="grid"></section>

<p id="emptyState" class="hidden empty">No items found.</p>

<script src="script.js"></script>
</body>
</html>
