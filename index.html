<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DonateWise | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <main class="login-page">
    <section class="login-card reveal">
      <div class="login-brand">
        <p class="eyebrow">DONATEWISE</p>
        <h1>Staff Inventory Portal</h1>
        <p>Connected storefront for Drop-In Centre staff powered by SharePoint data.</p>
      </div>

      <form class="login-form" id="loginForm">
        <label for="email">Staff Email</label>
        <input type="email" id="email" placeholder="name@thedi.ca" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <button type="submit" class="login-btn">Access Portal</button>
      </form>

      <p class="login-note">Live MVP connected to SharePoint inventory data</p>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBmw1AOxjwaY8VKcTSATLYuyjxXeIBAxaA",
      authDomain: "donatewise-d5b36.firebaseapp.com",
      projectId: "donatewise-d5b36",
      storageBucket: "donatewise-d5b36.firebasestorage.app",
      messagingSenderId: "629851717299",
      appId: "1:629851717299:web:1665728022021792fd7ac6",
      measurementId: "G-V4DMSTBYFV"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Login successful!");
        window.location.href = "home.html";
      } catch (error) {
        alert("Login failed: " + error.message);
        console.error(error);
      }
    });
  </script>
</body>
</html>
