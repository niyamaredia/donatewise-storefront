<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DonateWise | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <main class="login-page">
    <section class="login-card reveal">
      <div class="login-brand">
        <p class="eyebrow">DONATEWISE</p>
        <h1>Staff Inventory Portal</h1>
        <p>Connected storefront for Drop-In Centre staff powered by SharePoint data.</p>
      </div>

      <form class="login-form" id="loginForm">
        <label for="email">Staff Email</label>
        <input type="email" id="email" placeholder="Enter your Microsoft email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Use Microsoft sign-in popup" required>

        <button type="submit" class="login-btn">Sign in with Microsoft</button>
      </form>

      <p class="login-note">Secure Microsoft Entra ID authentication enabled</p>
    </section>
  </main>

  <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
  <script>
    const msalConfig = {
      auth: {
        clientId: "50272edd-0fa9-4782-9248-d074e1acdee9",
        authority: "https://login.microsoftonline.com/common",
        redirectUri: "https://niyamaredia.github.io/donatewise-storefront/"
      },
      cache: {
        cacheLocation: "sessionStorage"
      }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      try {
        const result = await msalInstance.loginPopup({
          scopes: ["User.Read"]
        });

        alert("Welcome " + result.account.username);
        window.location.href = "home.html";
      } catch (error) {
        alert("Microsoft login failed: " + error.message);
        console.error(error);
      }
    });
  </script>
</body>
</html>
