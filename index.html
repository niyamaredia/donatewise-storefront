<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DonateWise | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <main class="login-page">
    <section class="login-card reveal">
      <div class="login-brand">
        <p class="eyebrow">DONATEWISE</p>
        <h1>Staff Inventory Portal</h1>
        <p>Connected storefront for Drop-In Centre staff powered by SharePoint data.</p>
      </div>

      <form class="login-form" id="loginForm">
        <label for="email">Staff Email</label>
        <input type="email" id="email" placeholder="Use your DonateWise Microsoft account" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Microsoft sign-in popup will handle this" required>

        <button type="submit" class="login-btn">Sign in with Microsoft</button>
      </form>

      <p class="login-note">Secure Microsoft Entra ID authentication enabled</p>
    </section>
  </main>

  <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
  <script>
    const msalConfig = {
      auth: {
        clientId: "07e940a2-e4a5-4cbd-a59e-99554b722377",
        authority: "https://login.microsoftonline.com/4bdbaab1-f9e6-46f2-939c-a3df7cf52b8e",
        redirectUri: "https://niyamaredia.github.io/donatewise-storefront/"
      },
      cache: {
        cacheLocation: "localStorage",
        storeAuthStateInCookie: false
      }
    };

    const loginRequest = {
      scopes: ["User.Read", "Sites.Read.All"]
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const loginForm = document.getElementById("loginForm");

    async function initAuth() {
      try {
        await msalInstance.initialize();

        const redirectResponse = await msalInstance.handleRedirectPromise();
        if (redirectResponse && redirectResponse.account) {
          msalInstance.setActiveAccount(redirectResponse.account);
          window.location.href = "home.html";
          return;
        }

        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) {
          msalInstance.setActiveAccount(accounts[0]);
        }
      } catch (error) {
        console.error("MSAL init error:", error);
      }
    }

    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();

      try {
        await msalInstance.loginPopup(loginRequest);
        window.location.href = "home.html";
      } catch (error) {
        console.error("Login failed:", error);
        alert("Microsoft login failed: " + (error.message || error));
      }
    });

    initAuth();
  </script>
</body>
</html>
